name: Test & Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 3.5.3
  GODOT_URL: https://github.com/godotengine/godot/releases/download/3.5.3-stable

jobs:
  test:
    name: Unit tests (GUT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot (headless)
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux_headless.64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version || true  # returns exit code 255 even when OK

      - name: Run GUT tests
        run: godot --path . -s addons/gut/gut_cmdln.gd -gdir=res://test/unit -gexit

  android:
    name: Build Android APK (debug)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot + export templates
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux_headless.64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -sSL -o templates.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/templates
          mv templates ~/.local/share/godot/templates/${GODOT_VERSION}.stable

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;30.0.3" "platforms;android-29" "cmdline-tools;latest"

      # sdkmanager needs the runner's default Java 17; Godot 3.5 export uses Java 11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Debug keystore + editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=2]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/debug_keystore = \"$HOME/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > ~/.config/godot/editor_settings-3.tres

      - name: Import assets
        run: timeout 90 godot --path . --editor || true

      - name: Export APK
        run: |
          mkdir -p build/android
          godot --path . --export-debug "Android" build/android/TanemNyak.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: TanemNyak-android-debug
          path: build/android/TanemNyak.apk
